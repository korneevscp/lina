<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastre Vallombre</title>
<link rel="stylesheet" href="style.css">
<style>
  .lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
  @media (max-width:800px){.lay{grid-template-columns:1fr}}
  h1{font-family:var(--mono);font-size:15px;letter-spacing:.15em;color:var(--dim);font-weight:normal;margin:0 0 14px}
  .mapbox{background:#d9d4c3;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
  .mapbox svg{display:block;width:100%;height:auto;max-height:88vh;margin:0 auto;cursor:crosshair}
  #hover{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);color:#d9a441;font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:3px;pointer-events:none}
  .side .card{margin-bottom:14px}
  .side label{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .row{display:flex;gap:6px;margin-top:6px}
  .row input{flex:1;min-width:0;font-family:var(--mono)}
  #info{font-size:14px}
  #info h3{margin:0 0 6px;font-size:16px;color:#fff}
  #info .ref{font-family:var(--mono);color:var(--amber);font-size:12px}
  #info table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  #info td{padding:4px 2px;border-bottom:1px solid var(--line);vertical-align:top}
  #info td:first-child{color:var(--dim);width:42%}
  .pins{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .pins button{font-size:12px;padding:3px 8px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" style="max-width:1100px">
  <a class="back" href="index.html">← retour au dossier</a>
  <h1>CADASTRE COMMUNAL — VALLOMBRE — CARROYAGE « VLB » (colonne-ligne)</h1>
  <div class="lay">
    <div class="mapbox">
      <div id="hover">VLB --</div>
      <svg id="map" viewBox="10 30 40 60" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="tree" width="1.6" height="1.6" patternUnits="userSpaceOnUse"><circle cx=".8" cy=".8" r=".45" fill="#7d9a6a"/></pattern>
          <pattern id="water" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M0 .5 q.25 -.2 .5 0 t.5 0" stroke="#5b86a8" stroke-width=".06" fill="none"/></pattern>
        </defs>
        <rect x="10" y="30" width="40" height="60" fill="#e4dfcd"/>
        <!-- grid -->
        <g id="grid"></g>
        <!-- bois -->
        <path d="M26 64 Q24 70 27 76 Q32 80 36 76 Q39 70 36 66 Q32 62 26 64Z" fill="url(#tree)" stroke="#7d9a6a" stroke-width=".1"/>
        <path d="M40 40 Q46 38 48 46 Q46 54 41 52 Q38 46 40 40Z" fill="url(#tree)" stroke="#7d9a6a" stroke-width=".1"/>
        <path d="M12 60 Q16 56 19 62 Q18 70 13 68Z" fill="url(#tree)" stroke="#7d9a6a" stroke-width=".1"/>
        <!-- étang -->
        <ellipse cx="41" cy="79" rx="3.4" ry="2.3" fill="#a9c3d6"/><ellipse cx="41" cy="79" rx="3.4" ry="2.3" fill="url(#water)"/>
        <!-- rivière -->
        <path d="M50 58 Q44 64 43 72 Q42 76 41 77" stroke="#a9c3d6" stroke-width=".5" fill="none"/>
        <!-- routes -->
        <path d="M20 36 L21 42 L24 47 L26 50 L28 55 L31 60 L30 70 L26 80 L22 90" stroke="#c9a44a" stroke-width=".8" fill="none"/>
        <path d="M20 36 L14 30" stroke="#c9a44a" stroke-width=".8" fill="none"/>
        <path d="M20 36 L22 40 L23 42 L25 44" stroke="#fff" stroke-width=".45" fill="none"/>
        <path d="M23 42 L24 47" stroke="#fff" stroke-width=".35" fill="none"/>
        <path d="M31 61 L33 63 L35 70 L36 77 L37 82" stroke="#8b7a5a" stroke-width=".3" stroke-dasharray=".6 .3" fill="none"/>
        <path d="M20 36 L30 34 L42 36" stroke="#fff" stroke-width=".35" fill="none"/>
        <!-- bourg -->
        <g fill="#9b8f7a">
          <rect x="18.6" y="34.6" width="1" height="1"/><rect x="20.4" y="34.2" width="1.2" height="1"/><rect x="21" y="36.3" width="1" height=".9"/><rect x="18.4" y="37.4" width="1.3" height="1"/><rect x="17" y="35.5" width=".9" height=".9"/>
          <rect x="22.3" y="34.8" width="1" height="1"/><rect x="16.2" y="37.8" width="1" height="1"/><rect x="24.6" y="43.4" width="1" height="1"/><rect x="26" y="44.6" width=".9" height=".9"/>
          <rect x="21.4" y="39.3" width="1.4" height="1.2" fill="#7c6f58"/>
        </g>
        <path d="M19.8 35.2 h.6 v-.6 h.3 v.6 h.6 v.3 h-.6 v.9 h-.3 v-.9 h-.6z" fill="#555"/>
        <!-- lavoir, moulin -->
        <rect x="23.7" y="46.7" width=".7" height=".5" fill="#6d8fa8"/>
        <rect x="32.7" y="62.6" width=".9" height=".9" fill="#8a7d68" stroke="#555" stroke-width=".08"/>
        <!-- ferme isolée (non légendée) -->
        <g fill="#8a7d68"><rect x="36.6" y="81.6" width="1.1" height=".8"/><rect x="37.9" y="81.9" width=".6" height=".9"/></g>
        <!-- labels -->
        <g font-family="Georgia,serif" fill="#3b3428" font-size=".85">
          <text x="15.2" y="33.4">VALLOMBRE (bourg)</text>
          <text x="22.9" y="40.2" font-size=".6">École</text>
          <text x="17.0" y="39.6" font-size=".55">Le Relais</text>
          <text x="24.6" y="47.6" font-size=".55">Lavoir</text>
          <text x="33.8" y="63.4" font-size=".6">Moulin de la Brêche</text>
          <text x="27.4" y="70.6" font-style="italic" fill="#4f6a3f">Bois de la Brêche</text>
          <text x="38.6" y="76" font-size=".6" fill="#3b5d78" font-style="italic">Étang des Noues</text>
          <text x="27.8" y="52.4" font-size=".55" transform="rotate(62 27.8 52.4)">D17</text>
          <text x="23.6" y="86" font-size=".6">→ Saint-Aubert (45 km)</text>
          <text x="33.6" y="72" font-size=".45" transform="rotate(78 33.6 72)">chemin du Moulin (privé)</text>
        </g>
        <g id="pins"></g>
        <!-- compass -->
        <g transform="translate(47 33)" font-family="Georgia" font-size=".8" fill="#3b3428"><path d="M0 -1.6 L.5 0 L0 -.3 L-.5 0Z" fill="#3b3428"/><text x="-.3" y="-1.9">N</text></g>
      </svg>
    </div>

    <div class="side">
      <div class="card">
        <label>RECHERCHE PAR CARREAU (ex : VLB 22-40)</label>
        <form class="row" onsubmit="return look()">
          <input id="q" placeholder="VLB __-__" autocomplete="off">
          <button>Chercher</button>
        </form>
        <p class="small dim" style="margin:8px 0 0">Ou cliquez directement sur la carte.</p>
      </div>
      <div class="card" id="info"><span class="dim small">Aucun carreau sélectionné.</span></div>
      <div class="card pins">
        <div>REPÈRES PLACÉS : <span id="np">0</span></div>
        <div class="small">Un clic sur la carte ajoute un repère rouge.</div>
        <button onclick="clearPins()">Effacer les repères</button>
      </div>
    </div>
  </div>
</div>
<script>
const g=document.getElementById('grid');let s='';
for(let x=10;x<=50;x+=1)s+=`<line x1="${x}" y1="30" x2="${x}" y2="90" stroke="#c7c0a8" stroke-width="${x%5?0.03:0.08}"/>`;
for(let y=30;y<=90;y+=1)s+=`<line x1="10" y1="${y}" x2="50" y2="${y}" stroke="#c7c0a8" stroke-width="${y%5?0.03:0.08}"/>`;
for(let x=10;x<50;x+=5)s+=`<text x="${x+.15}" y="30.8" font-size=".6" fill="#8a826b" font-family="monospace">${x}</text>`;
for(let y=35;y<90;y+=5)s+=`<text x="10.15" y="${y-.15}" font-size=".6" fill="#8a826b" font-family="monospace">${y}</text>`;
g.innerHTML=s;

const P = [
 {x:20,y:36,t:"Place de l'Église",d:{"Nature":"Bourg — domaine public","Remarque":"Bougies et dessins déposés depuis le 14/10"}},
 {x:19,y:38,t:"Bar-tabac Le Relais",d:{"Parcelle":"AB-03","Propriétaire":"SARL Le Relais","Remarque":"Caméra de terrasse (orientée vers la place)"}},
 {x:22,y:40,t:"École primaire Les Tilleuls",d:{"Parcelle":"AB-12","Propriétaire":"Commune de Vallombre","Accès":"Portail rue des Tilleuls"}},
 {x:22,y:41,t:"Grillage de la cour d'école (côté rue)",d:{"Nature":"Trottoir, rue de l'École","Remarque":"Vue directe sur la cour de récréation à travers le grillage"}},
 {x:23,y:42,t:"Rue des Tilleuls — embranchement",d:{"Nature":"Voirie communale","Remarque":"Tout droit : domicile Morel. À gauche : chemin du lavoir"}},
 {x:25,y:44,t:"2, rue des Tilleuls",d:{"Parcelle":"AC-41","Propriétaire":"MOREL Claire","Usage":"Habitation"}},
 {x:24,y:47,t:"Lavoir communal",d:{"Parcelle":"AC-02","Propriétaire":"Commune","Remarque":"En bordure de la D17. Peu de passage. Pas de caméra."}},
 {x:26,y:50,t:"Route départementale D17",d:{"Nature":"Voirie départementale","Vitesse":"70 km/h"}},
 {x:28,y:55,t:"Route départementale D17",d:{"Nature":"Voirie départementale","Vitesse":"70 km/h"}},
 {x:31,y:60,t:"D17 — approche du carrefour",d:{"Nature":"Voirie départementale","Remarque":"Tout droit (sud-ouest) : Saint-Aubert. À gauche (sud-est) : chemin du Moulin"}},
 {x:31,y:61,t:"Carrefour D17 / chemin du Moulin",d:{"Nature":"Fossé — accotement","Remarque":"Lieu de découverte du téléphone (scellé n°3), 14/10 08h50"}},
 {x:33,y:63,t:"Moulin de la Brêche",d:{"Parcelle":"B-188","Propriétaire":"Commune","État":"Ruine — fouillé le 14/10, RAS","Accès":"Le chemin du Moulin se poursuit vers le sud — chemin privé, sans issue"}},
 {x:35,y:70,t:"Chemin du Moulin (privé)",d:{"Nature":"Chemin de terre — servitude privée","Desserte":"Une seule propriété en bout de chemin"}},
 {x:30,y:70,t:"Bois de la Brêche",d:{"Nature":"Forêt communale","Remarque":"Battue du 14/10 — RAS"}},
 {x:41,y:79,t:"Étang des Noues",d:{"Parcelle":"B-215","Propriétaire":"FAUVEL (indivision)","Remarque":"Plongeurs le 15/10 — RAS. Panneau « propriété privée — baignade interdite »."}},
 {x:37,y:82,t:"Lieu-dit Les Noues — ferme",d:{"Parcelle":"B-214","Propriétaires":"FAUVEL Gérald · FAUVEL Martine (indivision)","Acquis":"1989","Statut fiscal":"Bâti déclaré VACANT depuis 1997","Relevé électrique":"⚠ consommation en hausse continue depuis août 2026","Fouille":"NON — en attente de commission rogatoire"},hot:1}
];
function find(x,y){let best=null,bd=9;for(const p of P){const d=Math.hypot(p.x-x,p.y-y);if(d<=1.5&&d<bd){bd=d;best=p}}return best}
function show(x,y){
  const p=find(x,y), ref=`VLB ${x}-${y}`;
  const el=document.getElementById('info');
  if(!p){el.innerHTML=`<div class="ref">${ref}</div><h3>Parcelle agricole / non bâtie</h3><span class="small dim">Aucune information particulière.</span>`;return}
  el.innerHTML=`<div class="ref">${ref}${(p.x!==x||p.y!==y)?` → plus proche : VLB ${p.x}-${p.y}`:''}</div><h3${p.hot?' class="red glitch"':''}>${p.t}</h3><table>${Object.entries(p.d).map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>`;
}
function look(){
  const m=document.getElementById('q').value.match(/(\d{1,2})\s*[-\/ .,]\s*(\d{1,2})/);
  if(!m){document.getElementById('info').innerHTML='<span class="small red">Format attendu : VLB 22-40</span>';return false}
  const x=+m[1],y=+m[2]; show(x,y); pin(x,y); return false;
}
let pins=[];
function pin(x,y){pins.push([x,y]);drawPins()}
function drawPins(){
  document.getElementById('pins').innerHTML = (pins.length>1?`<polyline points="${pins.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#b3261e" stroke-width=".15" stroke-dasharray=".4 .25"/>`:'')+
   pins.map((p,i)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r=".45" fill="#b3261e" stroke="#fff" stroke-width=".1"/><text x="${p[0]+.6}" y="${p[1]-.4}" font-size=".6" fill="#b3261e" font-family="monospace">${i+1}</text></g>`).join('');
  document.getElementById('np').textContent=pins.length;
}
function clearPins(){pins=[];drawPins()}
const svgEl=document.getElementById('map');
function toGrid(e){const pt=svgEl.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svgEl.getScreenCTM().inverse());return [Math.round(q.x),Math.round(q.y)]}
svgEl.addEventListener('mousemove',e=>{const [x,y]=toGrid(e);document.getElementById('hover').textContent=`VLB ${x}-${y}`});
svgEl.addEventListener('click',e=>{const [x,y]=toGrid(e);document.getElementById('q').value=`VLB ${x}-${y}`;show(x,y);pin(x,y)});
</script>
</body>
</html>
