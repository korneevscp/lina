<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extraction scellé 3</title>
<link rel="stylesheet" href="style.css">
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .top{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center;margin-bottom:14px}
  .top b{color:var(--red2)}
  .phone{width:100%;max-width:390px;height:780px;max-height:calc(100vh - 110px);min-height:560px;margin:0 auto;background:#000;border:10px solid #1a1a1a;border-radius:42px;position:relative;overflow:hidden;box-shadow:0 0 0 2px #333,0 20px 60px rgba(0,0,0,.8)}
  .phone .crack{position:absolute;inset:0;pointer-events:none;z-index:50;opacity:.35}
  .sb{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;color:#ddd;background:#000;position:relative;z-index:5}
  .screen{position:absolute;top:34px;left:0;right:0;bottom:0;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;background:#0f0f12;display:none}
  .view.on{display:block}
  #home{background:linear-gradient(160deg,#2b2048,#0f1530 60%,#08080c);padding:30px 18px}
  .clock{text-align:center;color:#fff;font-size:54px;font-weight:200;margin:10px 0 0}
  .date{text-align:center;color:#ccd;font-size:14px;margin-bottom:34px}
  .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px}
  .app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:#eee;font-size:12px;background:none;border:none;padding:0}
  .app .i{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
  .app:hover .i{transform:scale(1.06)}
  .badge{position:relative}
  .badge::after{content:attr(data-n);position:absolute;top:-6px;right:-6px;background:#e0332a;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px}
  .hdr{position:sticky;top:0;background:#16161b;border-bottom:1px solid #26262c;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:3;color:#fff;font-weight:600}
  .hdr button{background:none;border:none;color:#5aa0ff;font-size:15px;padding:0}
  .list .row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #1e1e24;cursor:pointer}
  .list .row:hover{background:#18181e}
  .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none;color:#fff;font-weight:600}
  .row .nm{color:#fff;font-weight:600;font-size:15px}
  .row .pv{color:#999;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .row .tm{margin-left:auto;color:#777;font-size:11px;align-self:flex-start}
  .chat{padding:12px 10px 30px;display:flex;flex-direction:column;gap:6px}
  .day{align-self:center;color:#888;font-size:11px;margin:12px 0 4px}
  .b{max-width:78%;padding:8px 12px;border-radius:18px;font-size:14px;line-height:1.35;color:#fff;word-wrap:break-word}
  .b .t{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right}
  .in{align-self:flex-start;background:#2a2a31;border-bottom-left-radius:5px}
  .out{align-self:flex-end;background:#2f6fe0;border-bottom-right-radius:5px}
  .b.ghost{background:#3a0f0f;border:1px solid #7a1a1a;animation:flick 3s infinite}
  .b .imgmsg{width:180px;border-radius:10px;overflow:hidden;cursor:pointer;display:block}
  .b .imgmsg svg{display:block;width:100%;height:auto}
  .sys{align-self:center;font-family:var(--mono);font-size:10px;color:#e2483d;border:1px dashed #7a1a1a;padding:4px 8px;margin:6px 0}
  .voice{display:flex;align-items:center;gap:8px;cursor:pointer}
  .voice .w{flex:1;height:18px;background:repeating-linear-gradient(90deg,#aaa 0 2px,transparent 2px 5px);mask:linear-gradient(90deg,#000 0,#000 100%);opacity:.7}
  .tr{font-size:12px;font-style:italic;color:#e7c6c6;margin-top:6px;display:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
  .th{aspect-ratio:1;overflow:hidden;cursor:pointer;background:#222;position:relative}
  .th svg{width:100%;height:100%;object-fit:cover;display:block}
  .sec{color:#aaa;font-size:12px;padding:14px 12px 6px;text-transform:uppercase;letter-spacing:.06em}
  .modal{position:absolute;inset:0;background:rgba(0,0,0,.96);z-index:20;display:none;flex-direction:column}
  .modal.on{display:flex}
  .modal .mh{display:flex;justify-content:space-between;padding:12px 14px;color:#fff;font-size:13px}
  .modal .mh button{background:none;border:none;color:#5aa0ff;padding:0}
  .modal .pic{flex:none;padding:0 8px}
  .modal .pic svg{width:100%;height:auto;display:block;border-radius:4px}
  .modal .meta{padding:12px 14px;overflow-y:auto;font-family:var(--mono);font-size:12px;color:#bdb;display:none}
  .modal .meta table{width:100%;border-collapse:collapse}
  .modal .meta td{padding:3px 4px;border-bottom:1px solid #222;vertical-align:top}
  .modal .meta td:first-child{color:#7a7;white-space:nowrap;padding-right:10px}
  .modal .mb{margin:10px 14px;background:#1c2a1c;border-color:#2e4a2e;color:#bdb;font-family:var(--mono);font-size:12px}
  .loc{padding:6px 0 30px}
  .loc .it{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid #1e1e24;font-size:13px;color:#ddd}
  .loc .it .h{font-family:var(--mono);color:#5aa0ff;width:46px;flex:none}
  .loc .it .g{font-family:var(--mono);color:#d9a441}
  .loc .it.last{background:#2a0c0c}
  .loc .note{font-size:12px;color:#999;padding:10px 14px}
  .calls .row .nm.miss{color:#ff5a50}
  .lock{padding:40px 20px;text-align:center;color:#ddd}
  .dots{display:flex;gap:14px;justify-content:center;margin:20px 0}
  .dots span{width:14px;height:14px;border-radius:50%;border:2px solid #aaa}
  .dots span.f{background:#aaa}
  .pad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;justify-content:center}
  .pad button{width:64px;height:64px;border-radius:50%;font-size:22px;background:#222;border:none;color:#fff}
  .pad button:active{background:#444}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .note-body{padding:18px;color:#e8e2c8;background:#1a1810;min-height:100%;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:15px;line-height:1.6;white-space:pre-wrap}
  .note-body h4{margin:0 0 4px;font-family:system-ui;font-size:12px;color:#998}
  .note-body hr{border:none;border-top:1px dashed #554;margin:18px 0}
</style>
</head>
<body>
<div class="wrap" style="padding-top:14px">
  <a class="back" href="index.html">← retour au dossier</a>
  <div class="top">SCELLÉ N°3 — EXTRACTION LOGIQUE — PROPRIÉTAIRE : MOREL LINA — <b>LECTURE SEULE</b></div>

  <div class="phone">
    <svg class="crack" viewBox="0 0 370 760" preserveAspectRatio="none"><g stroke="#fff" stroke-width=".8" fill="none"><path d="M300 90 L262 150 L270 210 L230 260"/><path d="M262 150 L210 170 L170 160"/><path d="M270 210 L320 250 L340 300"/><path d="M230 260 L240 330"/><path d="M300 90 L340 60"/></g></svg>

        <div class="date">mardi 13 octobre</div>

      <div class="view" id="loc"><div class="hdr"><button onclick="home()">‹ Accueil</button>Localiser — historique</div><div class="loc" id="loclist"></div></div>
      <div class="view calls" id="calls"><div class="hdr"><button onclick="home()">‹ Accueil</button>Appels récents</div><div class="list" id="calllist"></div></div>
      <div class="view" id="notes"><div class="hdr"><button onclick="home()">‹ Accueil</button>Notes</div><div id="notesbody"></div></div>

      <div class="modal" id="modal">
        <div class="mh"><button onclick="closeM()">‹ Retour</button><span id="mname"></span><span></span></div>
        <div class="pic" id="mpic"></div>
        <button class="mb" onclick="toggleMeta()">ⓘ Afficher les métadonnées (EXIF)</button>
        <div class="meta" id="mmeta"></div>
      </div>
    </div>
  </div>
</div>

let uid=0; const svg = k => IMG[k]('g'+(uid++));

/* ---------- PHOTOS + EXIF ---------- */

];
function renderPhotos(){
  const secs = [...new Set(PHOTOS.map(p=>p.sec))];
  document.getElementById('photogrid').innerHTML = secs.map(s=>`<div class="sec">${s}${s==='Supprimés récemment'?' · 1 élément':''}</div><div class="grid">${PHOTOS.map((p,i)=>p.sec===s?`<div class="th" onclick="showPhoto(${i})" style="${p.del?'opacity:.55':''}">${svg(p.k)}</div>`:'').join('')}</div>`).join('');
}
function showPhoto(i){

/* ---------- NOTES (verrouillé) ---------- */
let code="";
const H = s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h};
const NOTE_KEY = 2181916214; // hash du code
function renderLock(){
  document.getElementById('notesbody').innerHTML = `<div class="lock" id="lockbox"><div style="font-size:34px">🔒</div><div>Notes protégées</div><div class="small dim">Saisis ton code secret</div>
  <div class="dots">${[0,1,2,3].map(i=>`<span class="${i<code.length?'f':''}"></span>`).join('')}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>n===''?'<span></span>':`<button onclick="key('${n}')">${n}</button>`).join('')}</div>
  <div class="small dim" style="margin-top:18px">indice enregistré : « le jour où elle est allée dans l'eau »</div></div>`;
}
function key(n){
  if(n==='⌫'){code=code.slice(0,-1);renderLock();return}
  code+=n; renderLock();
  if(code.length===4){
    if(H("vlb"+code)===NOTE_KEY){ showNotes(); }
    else { const b=document.getElementById('lockbox'); b.classList.add('shake'); setTimeout(()=>{code="";renderLock()},450); }
  }
}
