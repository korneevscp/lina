<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Répondre</title>
<link rel="stylesheet" href="style.css">
<style>
  body{font-family:var(--mono)}
  .box{max-width:560px;margin:40px auto 0}
  label{display:block;font-size:13px;color:var(--dim);margin:18px 0 6px;letter-spacing:.08em}
  input{width:100%}
  button{margin-top:22px;width:100%;padding:12px;letter-spacing:.2em}
  #fb{margin-top:18px;font-size:14px;min-height:40px;white-space:pre-wrap}
  #end{display:none;white-space:pre-wrap;font-size:15px;line-height:1.7;margin-top:30px}
  .notif{position:fixed;top:-120px;left:50%;transform:translateX(-50%);width:min(360px,92vw);background:rgba(30,30,36,.97);border:1px solid #333;border-radius:16px;padding:12px 14px;font-family:system-ui,sans-serif;display:flex;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:top .6s;z-index:1000}
  .notif.on{top:14px}
  .notif .av{width:38px;height:38px;border-radius:50%;background:#1e3a7a;display:grid;place-items:center;font-size:20px;flex:none}
  .notif b{font-size:14px;color:#fff}
  .notif .m{font-size:14px;color:#ddd}
  .notif .t{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← retour au dossier</a>
  <div class="box" id="form">
    <p>Tu crois savoir ?<br><span class="dim small">Une seule chance de les surprendre. Après, ils sauront que tu sais.</span></p>
    <form onsubmit="return check()">
      <label>QUI L'A EMMENÉE ? (prénom et nom de chaque personne)</label>
      <input id="who" autocomplete="off" placeholder="…">
      <label>OÙ EST-ELLE ? (lieu-dit ou carreau VLB)</label>
      <input id="where" autocomplete="off" placeholder="…">
      <button>ENVOYER AUX ENQUÊTEURS</button>
    </form>
    <div id="fb"></div>
  </div>
  <div class="box" id="end"></div>
</div>

<div class="notif" id="notif"><div class="av">🦋</div><div><b>Élise 🦋</b><div class="m" id="nm"></div></div><span class="t">maintenant</span></div>

<script>
const H = s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h};
const K = {g:334416712, m:1448828521, n:3532862211, f:290668092};
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 -]/g," ");
let tries=0;
function check(){
  const who=norm(document.getElementById('who').value), wh=norm(document.getElementById('where').value);
  const ws=new Set(who.split(/[\s-]+/).filter(Boolean).map(w=>H("arg:"+w)));
  const wl=new Set(wh.split(/[\s-]+/).filter(Boolean).map(w=>H("arg:"+w)));
  const g=ws.has(K.g), m=ws.has(K.m), f=ws.has(K.f);
  const place = wl.has(K.n) || /37\D+82/.test(wh) || /b\s*-?\s*214/.test(wh);
  const fb=document.getElementById('fb'); tries++;
  let msg=[];
  if(/julien|morel/.test(who)) msg.push("✗ Julien Morel : badgé à Saint-Aubert jusqu'à 18h41. Relis le PV.");
  if(/kevin|brault/.test(who)) msg.push("✗ Kévin Brault : filmé en terrasse du Relais de 16h22 à 19h05.");
  if(/elise/.test(who)) msg.push("✗ Élise ne peut emmener personne. Elle est morte en 1996.\n  …n'est-ce pas ?");
  if(g&&m&&place){ win(); return false; }
  if(!msg.length){
    if((g||m||f)&&!(g&&m)) msg.push("~ Tu tiens un fil. Mais la témoin a vu un conducteur ET une passagère. Ils étaient deux. Il faut leurs deux prénoms.");
    else if(g&&m&&!place) msg.push("✓ Les noms sont bons.\n✗ Mais ce n'est pas là qu'elle est. La photo sait où c'est.");
    else if(!g&&!m&&place) msg.push("~ Le lieu semble juste. Mais à qui appartient-il ?");
    else msg.push("✗ Rien ne colle. Retourne dans le téléphone. Lis tout. Même ce qui a été supprimé.");
  }
  fb.innerHTML = '<span class="'+(msg[0].startsWith('✗')?'red':'')+'">'+msg.join("\n")+'</span>';
  if(tries===3) notify("tu cherches mal 🦋",4000);
  return false;
}
function notify(t,ms){const n=document.getElementById('notif');document.getElementById('nm').textContent=t;n.classList.add('on');setTimeout(()=>n.classList.remove('on'),ms)}
const END = [
"> transmission aux enquêteurs... OK",
"> commission rogatoire accordée en urgence... OK",
"",
"16 octobre 2026, 04h10. Lieu-dit Les Noues.",
"",
"La ferme est censée être vide depuis 1997.",
"Il y a de la lumière à l'étage.",
"",
"Dans la cuisine : une odeur de madeleines.",
"Gérald Fauvel est assis à la table. Il ne résiste pas.",
"Il répète seulement : « Je voulais qu'elle arrête de pleurer. »",
"Il ne parle pas de Lina. Il parle de sa sœur.",
"",
"À l'étage, une porte fermée à clé. Derrière, une voix chante.",
"« …luciole, luciole, reviens dans ta maison… »",
"",
"Martine Fauvel est assise au bord d'un lit couvert de poupées.",
"Elle brosse les cheveux d'une petite fille en anorak jaune.",
"Elle l'appelle Élise.",
"",
"Lina est vivante.",
"Elle a froid, elle a peur, mais elle est vivante.",
"",
"Quand on la porte dehors, elle ne regarde pas les gyrophares.",
"Elle regarde l'étang, et elle dit :",
"« Il y avait une autre fille, la nuit. Elle était mouillée.",
"  Elle a dit merci d'être venue. »",
"",
"Le téléphone prépayé d'« Élise » n'a jamais été retrouvé.",
"",
"                — DOSSIER CLOS —"
];
function win(){
  document.getElementById('form').style.display='none';
  const e=document.getElementById('end'); e.style.display='block';
  let i=0,j=0,out="";
  (function type(){
    if(i>=END.length){ setTimeout(()=>notify("merci de l'avoir ramenée. tu veux être mon amie toi aussi ?",9000),2500); setTimeout(()=>{document.title="🦋";},12000); return; }
    if(j<=END[i].length){ e.textContent=out+END[i].slice(0,j); j++; setTimeout(type,24); }
    else { out+=END[i]+"\n"; i++; j=0; setTimeout(type,END[i-1]===""?500:160); }
  })();
}
</script>
</body>
</html>
